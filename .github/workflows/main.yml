name: Main

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue.yml'
      - '.github/workflows/pull_request.yml'
      - 'fastlane/**'
      - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          # fork build: no keystore secrets available, use the debug keystore.
          # the signing certificate is embedded into the zygote at build time
          # (overridden by zygote/official_manager_cert.der), so a debug-signed
          # build pair is self-consistent. Pin the version name to the installed
          # official manager app (oss-173) so the manager UI does not flag a
          # version mismatch (red status card, exact string comparison).
          echo officialBuild=true >> local.properties
          echo appVerName=oss-173 >> local.properties

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradle prebuild
        run: |
          ./gradlew prebuild

      - name: Build APK
        run: |
          ./gradlew :app:assemble

      - name: Upload APK mappings
        uses: actions/upload-artifact@v7
        with:
          name: app-mappings
          path: "app/build/outputs/mapping/release"

      - name: Build module
        id: buildModule
        run: |
          ./gradlew :zygote:assemble
          echo "releaseName=$(ls zygote/build/outputs/magisk/release/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "debugName=$(ls zygote/build/outputs/magisk/debug/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "releaseFile=$(ls zygote/build/outputs/magisk/release/*.zip)" >> $GITHUB_OUTPUT
          echo "debugFile=$(ls zygote/build/outputs/magisk/debug/*.zip)" >> $GITHUB_OUTPUT
          echo "ossNum=$(ls app/build/outputs/apk/debug/*.apk | awk -F '(/|.apk)' '{print $6}' | cut -f4 -d'-')" >> $GITHUB_OUTPUT

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.releaseName }}
          path: ${{ steps.buildModule.outputs.releaseFile }}

      - name: Upload module mappings
        uses: actions/upload-artifact@v7
        with:
          name: zygote-mappings
          path: "zygote/build/outputs/mapping/release"

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.debugName }}
          path: ${{ steps.buildModule.outputs.debugFile }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: oss-${{ steps.buildModule.outputs.ossNum }}
          body: ${{ github.event.head_commit.message }}
          files: |
            ${{ steps.buildModule.outputs.releaseFile }}
            ${{ steps.buildModule.outputs.debugFile }}
            app/src/main/assets/translators.json
          tag_name: oss-${{ steps.buildModule.outputs.ossNum }}
